; Radio Wheel IV - iv-sdk port for GTA IV / EFLC 1.0.8.0
; Put this file next to RadioWheelIV.asi (plugins folder).

; Dim and tint the screen while the wheel is displayed.
bScreenOverlay TRUE
; Slow the game down while the wheel is displayed.
bSlowMotion    TRUE

; Port-specific options
; Show an icon + station name for 2 seconds after a quick next/previous tap.
bQuickSwitchHud TRUE
; Stop the game from also changing station when the same buttons are used by the wheel.
bBlockGameRadioInput TRUE
; Text font id used for the station name (SET_TEXT_FONT).
nFont 0
